[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomos-core"
version = "0.1.0"
description = "Secure RoomOS abstraction layer for Home Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.scripts]
roomos = "app.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
