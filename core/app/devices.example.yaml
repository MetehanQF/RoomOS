# RoomOS device registry — EXAMPLE
#
# This file is the single place where RoomOS logical IDs are mapped onto the
# Home Assistant entities of your installation. Clients only ever see the
# logical IDs (`living_room`); they never see or submit an entity ID.
#
# The entities below are placeholders and almost certainly do not exist in your
# Home Assistant. Copy this file and map it to your own:
#
#   cp core/app/devices.example.yaml config/devices.yaml
#   $EDITOR config/devices.yaml
#   echo "ROOMOS_DEVICE_REGISTRY=$PWD/config/devices.yaml" >> .env
#
# Find your entity IDs in Home Assistant under Developer tools -> States.
# `config/devices.yaml` is git-ignored: it describes your home, not the project.

# ---------------------------------------------------------------------------
# Lights
# ---------------------------------------------------------------------------
# Each key is a logical device ID exposed to clients. Keep them lowercase with
# underscores, and treat them as stable: renaming one is a breaking change for
# anything that stored it.
devices:
  living_room:
    entity_id: light.living_room
    name: Living Room
    # Kelvin bounds are validated server-side, per device. Read the real values
    # from the entity's min_color_temp_kelvin / max_color_temp_kelvin attributes.
    min_kelvin: 2500
    max_kelvin: 6500
    supports_effects: true

  bedroom:
    entity_id: light.bedroom
    name: Bedroom
    min_kelvin: 2500
    max_kelvin: 6500
    supports_effects: false

  desk_ambient:
    entity_id: light.desk_ambient
    name: Desk Ambient
    # A strip or lamp with a wider range than a standard bulb. RoomOS keeps the
    # ranges independent so one device is not clamped to another's limits.
    min_kelvin: 2500
    max_kelvin: 9000
    supports_effects: true

# ---------------------------------------------------------------------------
# Logical group
# ---------------------------------------------------------------------------
# RoomOS owns `all_room_lights` and expands it to each device above, so partial
# failures are reported per target. If Home Assistant also has a group entity
# covering the same lights, name it here so RoomOS keeps it out of the writable
# surface. Omit the whole section if you have no such group.
group:
  excluded_entity_id: light.all_lights

# ---------------------------------------------------------------------------
# Host monitoring (optional)
# ---------------------------------------------------------------------------
# Use generic node IDs. These appear in API routes and are sent to clients, so
# they should not be your real hostnames.
#
# Metric keys are the entity ID minus its domain, so `sensor.primary_cpu`
# becomes the metric `primary_cpu`. The web UI looks for <node>_cpu, _ram,
# _disk, _temperature and _uptime, and uses <node>_online as the node state.
# Remove this section entirely if you do not want host monitoring.
nodes:
  primary:
    name: Primary Node
    entities:
      - sensor.primary_cpu
      - sensor.primary_ram
      - sensor.primary_disk
      - sensor.primary_temperature
      - sensor.primary_uptime
      - binary_sensor.primary_online
      - binary_sensor.primary_container_runtime

  secondary:
    name: Secondary Node
    entities:
      - sensor.secondary_cpu
      - sensor.secondary_ram
      - sensor.secondary_disk
      - sensor.secondary_temperature
      - sensor.secondary_uptime
      - binary_sensor.secondary_online
      - binary_sensor.secondary_container_runtime

# ---------------------------------------------------------------------------
# Service health strip (optional)
# ---------------------------------------------------------------------------
# `source` is a human-readable label shown in the UI. Never put a Home Assistant
# entity ID there: it is sent to the browser, and the whole point of the
# registry is that entity IDs stay server-side.
services:
  - id: home_assistant
    source: RoomOS HA API

  - id: container_runtime
    entity_id: binary_sensor.primary_container_runtime
    source: Primary node binary sensor

  - id: companion_node
    entity_id: binary_sensor.secondary_online
    source: Secondary node binary sensor
