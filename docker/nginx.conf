# Default RoomOS Web server: plain HTTP on the container port.
#
# server_name is intentionally a catch-all. RoomOS is not a virtual-hosting
# front end, and reachability is controlled by the address Compose binds to
# (ROOMOS_BIND_ADDR). Host matching that does matter — the exact Host and Origin
# accepted for authenticated requests — is enforced by Core via
# ROOMOS_AUTH_ALLOWED_HOST and ROOMOS_AUTH_ALLOWED_ORIGIN, not here.
#
# Authentication requires a secure origin for its cookies, so a real deployment
# should use the compose.tls.yaml overlay or terminate TLS at its own reverse
# proxy. See docs/installation.md.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/includes/roomos-common.inc;
}
