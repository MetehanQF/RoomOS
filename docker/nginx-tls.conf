# Optional TLS front end, activated by the compose.tls.yaml overlay.
#
# Supply your own certificate and key; RoomOS does not issue or renew them.
# Any ACME client that can write a PEM pair works — point ROOMOS_TLS_CERT and
# ROOMOS_TLS_KEY at the deployed files. See docs/installation.md.
#
# A trusted origin is not cosmetic here: RoomOS session cookies are issued with
# the Secure attribute, so authentication only works over HTTPS.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /run/roomos-tls/fullchain.pem;
    ssl_certificate_key /run/roomos-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RoomOSTLS:1m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/includes/roomos-common.inc;
}
