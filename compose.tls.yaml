# Optional TLS overlay.
#
# RoomOS session cookies are issued Secure + HttpOnly, so device authentication
# only works over HTTPS. Use this overlay, or terminate TLS at your own reverse
# proxy, before pairing anything.
#
# RoomOS does not issue or renew certificates. Point ROOMOS_TLS_CERT and
# ROOMOS_TLS_KEY at a PEM pair from whatever ACME client you already run, then:
#
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
#
# Remember to set ROOMOS_AUTH_ALLOWED_ORIGIN and ROOMOS_AUTH_ALLOWED_HOST to the
# name your clients type. See docs/installation.md and docs/remote-access.md.

services:
  web:
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ROOMOS_TLS_CERT:?set ROOMOS_TLS_CERT to your fullchain.pem}:/run/roomos-tls/fullchain.pem:ro
      - ${ROOMOS_TLS_KEY:?set ROOMOS_TLS_KEY to your privkey.pem}:/run/roomos-tls/privkey.pem:ro
    ports:
      - "${ROOMOS_BIND_ADDR:-127.0.0.1}:${ROOMOS_HTTP_PORT:-5500}:8080"
      - "${ROOMOS_BIND_ADDR:-127.0.0.1}:${ROOMOS_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://127.0.0.1:8443/"]
